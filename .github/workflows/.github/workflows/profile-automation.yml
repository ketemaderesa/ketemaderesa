name: Profile Automation

on:
  push:
    paths:
      - README.md
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-readme:
    name: Check README
    runs-on: ubuntu-latest
    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Check README exists and is not empty
        run: |
          test -s README.md
          echo "README check passed."

      - name: Check for trailing whitespace
        run: |
          if grep -nE '[[:blank:]]+$' README.md; then
            echo "Please remove trailing whitespace from README.md."
            exit 1
          fi
          echo "Whitespace check passed."

  update-profile-metrics:
    name: Update profile activity and statistics
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Generate profile metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: ketemaderesa
          filename: github-metrics.svg
          base: header, activity, community, repositories, metadata
          plugin_activity: yes
          plugin_activity_days: 14
          plugin_activity_limit: 5
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
